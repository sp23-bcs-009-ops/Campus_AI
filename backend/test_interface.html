<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusAI — Backend Test Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-hover: #22262f;
            --border: #2a2e3a;
            --text: #e4e6ec;
            --text-muted: #8b8fa3;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --green: #22c55e;
            --red: #ef4444;
            --amber: #f59e0b;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ── Header ─────────────────────────── */
        header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 36px; height: 36px;
            background: var(--accent);
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 18px;
            font-weight: 700;
        }
        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .logo h1 span { color: var(--text-muted); font-weight: 400; font-size: 14px; margin-left: 8px; }

        #connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--red);
            transition: background 0.3s;
        }
        .status-dot.connected { background: var(--green); }

        /* ── Layout ─────────────────────────── */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: calc(100vh - 85px);
        }

        /* ── Left: Chat Panel ───────────────── */
        .chat-panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        .panel-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.65;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg.user {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.bot {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg.system {
            align-self: center;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
        }
        .msg.error {
            align-self: center;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: var(--red);
            font-size: 13px;
        }
        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-area input:focus { border-color: var(--accent); }
        .chat-input-area input::placeholder { color: var(--text-muted); }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.97); }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Right: Test Panel ──────────────── */
        .test-panel {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .test-cards {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: #3a3e4a; }
        .card-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .card-header h3 {
            font-size: 14px;
            font-weight: 600;
        }
        .card-header .method {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .method.get { background: rgba(34,197,94,0.15); color: var(--green); }
        .method.post { background: rgba(245,158,11,0.15); color: var(--amber); }

        .card-body {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card-body label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .card-body input, .card-body select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
        }
        .card-body input:focus, .card-body select:focus { border-color: var(--accent); }
        .card-body select option { background: var(--surface); }

        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
            width: fit-content;
        }
        .result-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            color: var(--text-muted);
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }
        .result-box.visible { display: block; }
        .result-box.success { border-color: rgba(34,197,94,0.4); color: var(--green); }
        .result-box.fail { border-color: rgba(239,68,68,0.4); color: var(--red); }

        .loading-dots::after {
            content: '';
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
        }

        /* ── Scrollbar ──────────────────────── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* ── Responsive ─────────────────────── */
        @media (max-width: 860px) {
            .container { grid-template-columns: 1fr; }
            .chat-panel { border-right: none; border-bottom: 1px solid var(--border); max-height: 50vh; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-icon">C</div>
        <h1>CampusAI <span>Backend Tester</span></h1>
    </div>
    <div id="connection-status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Checking...</span>
    </div>
</header>

<div class="container">

    <!-- ── Chat Panel ──────────────────────────── -->
    <div class="chat-panel">
        <div class="panel-header">💬 Chat — /ask endpoint</div>
        <div class="messages" id="messages">
            <div class="msg system">Send a message to test the /ask endpoint</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask CampusAI something..." autocomplete="off">
            <button id="send-btn" onclick="sendChat()">Send</button>
        </div>
    </div>

    <!-- ── Test Panel ──────────────────────────── -->
    <div class="test-panel">
        <div class="panel-header">🧪 Endpoint Tests</div>
        <div class="test-cards">

            <!-- COMSATS Status -->
            <div class="card">
                <div class="card-header">
                    <h3>/comsats/status</h3>
                    <span class="method get">GET</span>
                </div>
                <div class="card-body">
                    <label>Check COMSATS knowledge base status</label>
                    <button class="btn-sm" onclick="testEndpoint('/comsats/status', 'GET', null, 'result-status')">Test</button>
                    <div class="result-box" id="result-status"></div>
                </div>
            </div>

            <!-- Student Timetable -->
            <div class="card">
                <div class="card-header">
                    <h3>/student-timetable</h3>
                    <span class="method post">POST</span>
                </div>
                <div class="card-body">
                    <label>Class Name</label>
                    <input type="text" id="timetable-class" placeholder='e.g. BS(CS)-I, BS(AI)-IV'>
                    <button class="btn-sm" onclick="testTimetable()">Test</button>
                    <div class="result-box" id="result-timetable"></div>
                </div>
            </div>

            <!-- Today's Classes -->
            <div class="card">
                <div class="card-header">
                    <h3>/today-classes/{class_name}</h3>
                    <span class="method get">GET</span>
                </div>
                <div class="card-body">
                    <label>Class Name</label>
                    <input type="text" id="today-class" placeholder='e.g. BS(CS)-I'>
                    <button class="btn-sm" onclick="testToday()">Test</button>
                    <div class="result-box" id="result-today"></div>
                </div>
            </div>

            <!-- Class Schedule by Day -->
            <div class="card">
                <div class="card-header">
                    <h3>/class-schedule/{class}/{day}</h3>
                    <span class="method get">GET</span>
                </div>
                <div class="card-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div>
                            <label>Class Name</label>
                            <input type="text" id="schedule-class" placeholder='e.g. BS(CS)-I'>
                        </div>
                        <div>
                            <label>Day</label>
                            <select id="schedule-day">
                                <option value="Monday">Monday</option>
                                <option value="Tuesday">Tuesday</option>
                                <option value="Wednesday">Wednesday</option>
                                <option value="Thursday">Thursday</option>
                                <option value="Friday">Friday</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn-sm" onclick="testSchedule()">Test</button>
                    <div class="result-box" id="result-schedule"></div>
                </div>
            </div>

        </div>
    </div>

</div>

<script>
    const BASE = 'http://localhost:8000';

    // ── Connection Check ──────────────────────
    async function checkConnection() {
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        try {
            const res = await fetch(`${BASE}/comsats/status`, { signal: AbortSignal.timeout(3000) });
            if (res.ok) {
                dot.classList.add('connected');
                text.textContent = 'Connected — localhost:8000';
            } else {
                dot.classList.remove('connected');
                text.textContent = `Error ${res.status}`;
            }
        } catch {
            dot.classList.remove('connected');
            text.textContent = 'Not connected';
        }
    }
    checkConnection();
    setInterval(checkConnection, 10000);

    // ── Chat ──────────────────────────────────
    const messagesEl = document.getElementById('messages');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) sendChat(); });

    function addMsg(text, cls) {
        const div = document.createElement('div');
        div.className = `msg ${cls}`;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    async function sendChat() {
        const q = chatInput.value.trim();
        if (!q) return;
        chatInput.value = '';
        addMsg(q, 'user');
        sendBtn.disabled = true;

        const loader = addMsg('Thinking', 'system loading-dots');
        try {
            const res = await fetch(`${BASE}/ask`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: q })
            });
            loader.remove();
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            addMsg(data.answer || JSON.stringify(data, null, 2), 'bot');
        } catch (err) {
            loader.remove();
            addMsg(`Error: ${err.message}`, 'error');
        }
        sendBtn.disabled = false;
        chatInput.focus();
    }

    // ── Endpoint Tests ────────────────────────
    async function testEndpoint(path, method, body, resultId) {
        const box = document.getElementById(resultId);
        box.className = 'result-box visible';
        box.textContent = 'Loading...';
        try {
            const opts = { method };
            if (body) {
                opts.headers = { 'Content-Type': 'application/json' };
                opts.body = JSON.stringify(body);
            }
            const res = await fetch(`${BASE}${path}`, opts);
            const data = await res.json();
            box.textContent = JSON.stringify(data, null, 2);
            box.className = `result-box visible ${res.ok ? 'success' : 'fail'}`;
        } catch (err) {
            box.textContent = `Error: ${err.message}`;
            box.className = 'result-box visible fail';
        }
    }

    function testTimetable() {
        const cls = document.getElementById('timetable-class').value.trim();
        if (!cls) return;
        testEndpoint('/student-timetable', 'POST', { class_name: cls }, 'result-timetable');
    }

    function testToday() {
        const cls = document.getElementById('today-class').value.trim();
        if (!cls) return;
        testEndpoint(`/today-classes/${encodeURIComponent(cls)}`, 'GET', null, 'result-today');
    }

    function testSchedule() {
        const cls = document.getElementById('schedule-class').value.trim();
        const day = document.getElementById('schedule-day').value;
        if (!cls) return;
        testEndpoint(`/class-schedule/${encodeURIComponent(cls)}/${encodeURIComponent(day)}`, 'GET', null, 'result-schedule');
    }
</script>

</body>
</html>
